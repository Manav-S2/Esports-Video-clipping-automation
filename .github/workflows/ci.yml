name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The unit suite covers pure logic only; media/SDK deps are not required.
        run: python -m pip install --upgrade pip ruff pytest mypy loguru

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Unit tests (pytest)
        run: python -m pytest

  install-from-lockfile:
    # Proves a fresh clone installs reproducibly from the committed uv.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run test suite against the locked environment
        run: uv run python -m pytest

  docker-build:
    # Keeps the image from rotting: proves a fresh clone builds and its test
    # suite passes with no host ffmpeg/streamlink installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cs2-highlight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the test suite inside the image
        run: docker run --rm cs2-highlight:ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit against requirements
        # Blocking: a known vulnerability in a pinned dependency fails the build.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
